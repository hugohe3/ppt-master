[project]
name = "ppt-master"
version = "0.1.40"
description = "AI-driven multi-format SVG content generation system"
readme = "PYPI_README.md"
license = { text = "MIT" }
authors = [{ name = "elvisw" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # SVG to PPTX export
    "python-pptx>=0.6.21",
    "XlsxWriter>=3.0.0",
    # Recorded narration
    "edge-tts>=7.2.8",
    # Office compatibility (SVG to PNG fallback)
    "svglib>=1.5.0",
    "reportlab>=4.0.0",
    # PDF to Markdown
    "PyMuPDF>=1.23.0",
    # Document to Markdown (native paths)
    "mammoth>=1.6.0",
    "markdownify>=0.11.6",
    "ebooklib>=0.18",
    "nbconvert>=7.0.0",
    # Excel to Markdown
    "openpyxl>=3.1.0",
    # Image processing
    "Pillow>=9.0.0",
    "numpy>=1.20.0",
    # Web to Markdown
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "curl_cffi>=0.7.0",
    # AI image generation
    "google-genai>=1.0.0",
    # SVG editor server
    "flask>=3.0.0",
]

[project.urls]
Repository = "https://github.com/elvisw/ppt-master"

[project.scripts]
ppt-master = "cli:main"

[tool.uv]
# Keep all three dependency manifests in sync:
#   1. pyproject.toml (this file)
#   2. skills/ppt-master/pyproject.toml
#   3. skills/ppt-master/requirements.txt
# When any one changes, mirror to the other two and run `uv lock` in both directories:
#   uv lock && cd skills/ppt-master && uv lock

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["skills", "skills.*", "skills.*.*", "skills.*.*.*"]
exclude = ["projects", "projects.*"]
