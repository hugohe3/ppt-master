name: Verify & Publish

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "skills/ppt-master/pyproject.toml"

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup uv
        if: steps.check.outputs.exists == 'false'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Setup Python
        if: steps.check.outputs.exists == 'false'
        run: uv python install 3.12 && uv python pin 3.12

      # ── Step 1: OpenCode Agent 自动适配 uvx 命令 ──
      - name: OpenCode — adapt uvx commands
        if: steps.check.outputs.exists == 'false'
        id: opencode
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          npm install -g opencode-ai@latest
          opencode run -m deepseek/deepseek-v4-pro "$(cat <<'ENDPROMPT'
          你是 ppt-master 项目的 uvx 适配助手。当前项目是一个 fork，已将上游的 python3 命令转换为 uvx ppt-master 格式。

          ## 你的任务

          扫描以下文件中所有需要转换为 uvx 格式的命令，并直接修改文件：

          1. skills/ppt-master/ 下所有 .md 文件中查找并替换：
             python3 skills/ppt-master/scripts/xxx.py → uvx ppt-master <command>
             python3 scripts/xxx.py → uvx ppt-master <command>
             uv run skills/ppt-master/scripts/xxx.py → uvx ppt-master <command>
             uv run scripts/xxx.py → uvx ppt-master <command>

          2. AGENTS.md 和 CLAUDE.md 中做同样替换

          3. docs/ 下（排除 superpowers/、windows-installation/、code-style、upstream-sync）做同样替换

          ## 命令映射规则

          查看 cli.py 的 COMMANDS 字典获取映射。关键映射：
          project_manager.py→project, notes_to_audio.py→notes-to-audio, svg_to_pptx.py→svg-to-pptx,
          total_md_split.py→total-md-split, finalize_svg.py→finalize-svg, template_fill_pptx.py→template-fill-pptx,
          native_enhance_pptx.py→native-enhance-pptx, confirm_ui/server.py→confirm-ui, pptx_intake.py→pptx-intake,
          animation_config.py→animation-config, check_deps_sync.py→check-deps-sync, icon_sync.py→icon-sync

          ## 约束

          - skills/ppt-master/scripts/ 下 .py 文件不要修改
          - docs/superpowers/ 不要修改
          - docs/zh/upstream-sync.md 不要修改
          - svg_finalize/ 下内部脚本不转换（flatten_tspan, svg_rect_to_path, fix_image_aspect, embed_icons）

          完成后运行 python3 skills/ppt-master/scripts/check_cli_sync.py。
          如有缺失脚本按 kebab-case 同时加入 cli.py 和 skills/ppt-master/cli.py。
          ENDPROMPT
          )"

      # ── 提交 OpenCode 改动 ──
      - name: Commit OpenCode fixes
        if: steps.check.outputs.exists == 'false'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes from OpenCode adaptation."
          else
            git add -u
            git commit -m "fix: opencode auto-correct uvx command format" || true
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Committed OpenCode fixes and pushed."
          fi

      # ── Gate 1: CLI 映射完整性 ──
      - name: Gate — CLI mappings
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 skills/ppt-master/scripts/check_cli_sync.py
          echo "✅ CLI mappings OK"

      # ── Gate 2: 无 python3 残留 ──
      - name: Gate — No python3 remnants
        if: steps.check.outputs.exists == 'false'
        run: |
          MATCHES=$(grep -rn --include='*.md' 'python3 skills/ppt-master/scripts/' skills/ppt-master/ AGENTS.md CLAUDE.md docs/ 2>/dev/null | grep -v 'superpowers' | grep -v 'windows-installation' | grep -v 'code-style' | grep -v 'upstream-sync' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::python3 command remnants found — uvx adaptation incomplete"
            exit 1
          fi
          echo "✅ No python3 remnants"

      # ── Gate 3: 无 uv run 残留 ──
      - name: Gate — No uv run remnants
        if: steps.check.outputs.exists == 'false'
        run: |
          MATCHES=$(grep -rn --include='*.md' 'uv run skills/ppt-master/scripts/\|uv run scripts/' skills/ppt-master/ AGENTS.md CLAUDE.md docs/ 2>/dev/null | grep -v 'superpowers' | grep -v 'windows-installation' | grep -v 'code-style' | grep -v 'upstream-sync' | grep -v 'svg_finalize' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::uv run remnants found — should be uvx ppt-master <command>"
            exit 1
          fi
          echo "✅ No uv run remnants"

      # ── Gate 4: 依赖清单一致性 ──
      - name: Gate — Dependency sync
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 skills/ppt-master/scripts/check_deps_sync.py
          echo "✅ Dependencies in sync"

      # ── 通过所有门禁，创建 tag → 触发 publish-pypi.yml ──
      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "✅ Tag ${{ steps.version.outputs.tag }} created → publish-pypi.yml"
