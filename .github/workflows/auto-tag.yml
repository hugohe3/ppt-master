name: Verify & Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Check UVX Migration"]
    types: [completed]

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      id-token: write
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup uv
        if: steps.check.outputs.exists == 'false'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Setup Python
        if: steps.check.outputs.exists == 'false'
        run: uv python install 3.12 && uv python pin 3.12

      # ── Step 1: 自动修复 uvx 命令格式 ──
      - name: Auto-fix uvx commands
        if: steps.check.outputs.exists == 'false'
        run: python3 skills/ppt-master/scripts/auto_fix_uvx.py

      # ── 提交 OpenCode 改动 ──
      - name: Commit OpenCode fixes
        if: steps.check.outputs.exists == 'false'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes from OpenCode adaptation."
          else
            git add -u
            git commit -m "fix: opencode auto-correct uvx command format" || true
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Committed OpenCode fixes and pushed."
          fi

      # ── Gate 0: 版本一致性 ──
      - name: Gate — Version sync
        if: steps.check.outputs.exists == 'false'
        run: |
          ROOT=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SKILL=$(python3 -c "import tomllib; print(tomllib.load(open('skills/ppt-master/pyproject.toml','rb'))['project']['version'])")
          if [ "$ROOT" != "$SKILL" ]; then
            echo "::error::Version mismatch: root=$ROOT skill=$SKILL"
            exit 1
          fi
          echo "✅ Versions match: $ROOT"

      # ── Gate 1: CLI 映射完整性 ──
      - name: Gate — CLI mappings
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 skills/ppt-master/scripts/check_cli_sync.py
          echo "✅ CLI mappings OK"

      # ── Gate 2: 无 python3 残留 ──
      - name: Gate — No python3 remnants
        if: steps.check.outputs.exists == 'false'
        run: |
          MATCHES=$(grep -rn --include='*.md' 'python3 skills/ppt-master/scripts/' skills/ppt-master/ AGENTS.md CLAUDE.md docs/ 2>/dev/null | grep -v 'superpowers' | grep -v 'windows-installation' | grep -v 'code-style' | grep -v 'upstream-sync' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::python3 command remnants found — uvx adaptation incomplete"
            exit 1
          fi
          echo "✅ No python3 remnants"

      # ── Gate 3: 无 uv run 残留 ──
      - name: Gate — No uv run remnants
        if: steps.check.outputs.exists == 'false'
        run: |
          MATCHES=$(grep -rn --include='*.md' 'uv run skills/ppt-master/scripts/\|uv run scripts/' skills/ppt-master/ AGENTS.md CLAUDE.md docs/ 2>/dev/null | grep -v 'superpowers' | grep -v 'windows-installation' | grep -v 'code-style' | grep -v 'upstream-sync' | grep -v 'svg_finalize' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::uv run remnants found — should be uvx ppt-master <command>"
            exit 1
          fi
          echo "✅ No uv run remnants"

      # ── Gate 4: 依赖清单一致性 ──
      - name: Gate — Dependency sync
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 skills/ppt-master/scripts/check_deps_sync.py
          echo "✅ Dependencies in sync"

      # ── 通过所有门禁，创建 tag → 触发 publish-pypi.yml ──
      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "✅ Tag ${{ steps.version.outputs.tag }} created"

      - name: Trigger PyPI publish
        if: steps.check.outputs.exists == 'false'
        run: |
          gh workflow run publish-pypi.yml --ref "${{ steps.version.outputs.tag }}"
          echo "✅ Triggered publish-pypi.yml for ${{ steps.version.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
