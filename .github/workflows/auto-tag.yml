name: Verify & Publish

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "skills/ppt-master/pyproject.toml"

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup uv
        if: steps.check.outputs.exists == 'false'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Setup Python
        if: steps.check.outputs.exists == 'false'
        run: uv python install 3.12 && uv python pin 3.12

      # ── 自动修复：转换 python3/uv run → uvx ──
      - name: Auto-fix uvx commands
        if: steps.check.outputs.exists == 'false'
        id: autofix
        run: |
          python3 -c "
          import re, ast, pathlib, sys

          # 解析 cli.py COMMANDS 字典
          tree = ast.parse(pathlib.Path('cli.py').read_text())
          commands = {}
          for node in ast.walk(tree):
              if isinstance(node, ast.Dict):
                  keys = [k.value for k in node.keys if isinstance(k, ast.Constant)]
                  vals = [v.value for v in node.values if isinstance(v, ast.Constant)]
                  if 'project' in keys and 'project_manager.py' in vals:
                      commands = dict(zip(keys, vals)); break

          script_to_cmd = {}
          for cmd_name, script_rel in commands.items():
              script_name = script_rel.replace('\\\\', '/').split('/')[-1]
              script_to_cmd[script_name] = cmd_name

          exclude = ['superpowers', 'windows-installation', 'code-style', 'upstream-sync']
          root = pathlib.Path('.')
          targets = list(root.glob('skills/ppt-master/**/*.md'))
          targets += [root / 'AGENTS.md', root / 'CLAUDE.md']
          targets += [f for f in root.glob('docs/**/*.md') if not any(k in str(f) for k in exclude)]
          targets += list(root.glob('projects/**/*.md'))

          fixed = 0
          for fp in sorted(set(targets)):
              content = fp.read_text()
              original = content
              for script_name, cmd_name in sorted(script_to_cmd.items()):
                  p = re.escape(script_name)
                  content = re.sub(rf'python3\s+skills/ppt-master/scripts/(\S*/)?{p}', f'uvx ppt-master {cmd_name}', content)
                  content = re.sub(rf'(?<!\w)python3\s+scripts/(\S*/)?{p}', f'uvx ppt-master {cmd_name}', content)
                  content = re.sub(rf'uv\s+run\s+skills/ppt-master/scripts/(\S*/)?{p}', f'uvx ppt-master {cmd_name}', content)
                  content = re.sub(rf'(?<!\w)uv\s+run\s+scripts/(\S*/)?{p}', f'uvx ppt-master {cmd_name}', content)
              if content != original:
                  fp.write_text(content)
                  fixed += 1
                  print(f'Fixed: {fp}')
          print(f'Total files auto-fixed: {fixed}')
          "

      # ── 提交自动修复 ──
      - name: Commit auto-fixes
        if: steps.check.outputs.exists == 'false'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git add -u
            git commit -m "fix: auto-correct uvx command format" || true
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Committed auto-fixes and pushed."
          fi

      # ── Gate 1: CLI 映射完整性 ──
      - name: Gate — CLI mappings
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 skills/ppt-master/scripts/check_cli_sync.py
          echo "✅ CLI mappings OK"

      # ── Gate 2: 无 python3 残留 ──
      - name: Gate — No python3 remnants
        if: steps.check.outputs.exists == 'false'
        run: |
          MATCHES=$(grep -rn --include='*.md' 'python3 skills/ppt-master/scripts/' skills/ppt-master/ AGENTS.md CLAUDE.md docs/ 2>/dev/null | grep -v 'superpowers' | grep -v 'windows-installation' | grep -v 'code-style' | grep -v 'upstream-sync' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::python3 command remnants found — uvx adaptation incomplete"
            exit 1
          fi
          echo "✅ No python3 remnants"

      # ── Gate 3: 无 uv run 残留 ──
      - name: Gate — No uv run remnants
        if: steps.check.outputs.exists == 'false'
        run: |
          MATCHES=$(grep -rn --include='*.md' 'uv run skills/ppt-master/scripts/\|uv run scripts/' skills/ppt-master/ AGENTS.md CLAUDE.md docs/ 2>/dev/null | grep -v 'superpowers' | grep -v 'windows-installation' | grep -v 'code-style' | grep -v 'upstream-sync' | grep -v 'svg_finalize' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::uv run remnants found — should be uvx ppt-master <command>"
            exit 1
          fi
          echo "✅ No uv run remnants"

      # ── Gate 4: 依赖清单一致性 ──
      - name: Gate — Dependency sync
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 skills/ppt-master/scripts/check_deps_sync.py
          echo "✅ Dependencies in sync"

      # ── 通过所有门禁，创建 tag → 触发 publish-pypi.yml ──
      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "✅ Tag ${{ steps.version.outputs.tag }} created → publish-pypi.yml"
