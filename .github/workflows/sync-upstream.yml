name: Sync Upstream

on:
  schedule:
    # 每天 UTC 8:00（北京时间 16:00）
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Setup Python
        run: uv python install 3.12 && uv python pin 3.12

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Check upstream changes
        id: upstream
        run: |
          git remote add upstream https://github.com/hugohe3/ppt-master.git 2>/dev/null || true
          git fetch upstream main
          CHANGES=$(git log main..upstream/main --oneline)
          if [ -z "$CHANGES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No upstream changes — skipping sync."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Upstream changes detected:"
            echo "$CHANGES"
          fi

      # schedule 事件：OpenCode action 自动跳过权限，创建分支+PR
      - name: Run OpenCode Sync (auto)
        if: github.event_name == 'schedule' && steps.upstream.outputs.has_changes == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: deepseek/deepseek-v4-pro
          prompt: |
            Read `.opencode/command/sync-upstream.md` and follow ALL steps exactly as written.
            Use `python3` not `python`. Do NOT manually create tags or push to main.
            If no upstream changes, stop immediately.

      # workflow_dispatch 事件：opencode CLI 非交互模式
      - name: Configure git for push (manual)
        if: github.event_name == 'workflow_dispatch' && steps.upstream.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/elvisw/ppt-master.git"

      - name: Run OpenCode Sync (manual)
        if: github.event_name == 'workflow_dispatch' && steps.upstream.outputs.has_changes == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          npm install -g opencode-ai@latest
          opencode run --dangerously-skip-permissions -m deepseek/deepseek-v4-pro "Read .opencode/command/sync-upstream.md and follow ALL steps. Use python3. No tags. Push to main at Step 6. Stop if no upstream changes."

      - name: Trigger auto-tag pipeline (manual)
        if: github.event_name == 'workflow_dispatch' && steps.upstream.outputs.has_changes == 'true'
        run: gh workflow run auto-tag.yml --ref main --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
