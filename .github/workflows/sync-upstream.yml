name: Sync Upstream

on:
  schedule:
    # 每周一 UTC 8:00（北京时间 16:00）
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Setup Python
        run: uv python install 3.12 && uv python pin 3.12

      # schedule 事件：OpenCode action 自动跳过权限，创建分支+PR
      - name: Run OpenCode Sync (auto)
        if: github.event_name == 'schedule'
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: deepseek/deepseek-v4-pro
          prompt: |
            Read `.opencode/command/sync-upstream.md` and follow ALL steps exactly as written.
            Use `python3` not `python`. Do NOT manually create tags or push to main.
            If no upstream changes, stop immediately.

      # workflow_dispatch 事件：opencode CLI 非交互模式（自动批准权限）
      - name: Run OpenCode Sync (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          npm install -g opencode-ai@latest
          opencode run -m deepseek/deepseek-v4-pro "Read .opencode/command/sync-upstream.md and follow ALL steps. Use python3. No tags. Stop if no upstream changes."
