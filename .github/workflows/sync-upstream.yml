name: Sync Upstream

on:
  schedule:
    # 每周一 UTC 8:00（北京时间 16:00）
    - cron: "0 8 * * 1"

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Setup Python
        run: uv python install 3.12 && uv python pin 3.12

      - name: Run OpenCode Sync
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: deepseek/deepseek-v4-pro
          prompt: |
            Read `.opencode/command/sync-upstream.md` and follow ALL steps exactly as written.

            Important adaptations for this GHA run:
            - Use `python3` instead of `python` (Ubuntu runner)
            - Do NOT manually create or push git tags
            - Do NOT manually push to main — infrastructure handles branch/PR creation
            - If no upstream changes, stop immediately
            - Keep all commits on the current branch
