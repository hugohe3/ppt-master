name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    timeout-minutes: 30
    if: |
      (contains(github.event.comment.body, '/oc ') || contains(github.event.comment.body, '/oc\n') ||
       startsWith(github.event.comment.body, '/oc ') || startsWith(github.event.comment.body, '/oc\n') ||
       contains(github.event.comment.body, '/opencode ') || contains(github.event.comment.body, '/opencode\n') ||
       startsWith(github.event.comment.body, '/opencode ') || startsWith(github.event.comment.body, '/opencode\n')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      github.event.comment.user.login != 'opencode-agent'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: deepseek/deepseek-v4-pro
