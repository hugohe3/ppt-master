name: Build and Publish Wheel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel
        run: |
          uv build --wheel
          # Create a stable-link copy with a dummy version for permanent download URL
          cp dist/ppt_master-*.whl dist/ppt_master-0.0.0-py3-none-any.whl

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ppt_master-*.whl
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
