<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="report_core_divider_master" data-pptx-master-name="Report Core Divider"
  data-pptx-layout="closing" data-pptx-layout-name="Closing">
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#1E293B"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="closing-accent" x="48" y="280" width="88" height="6" rx="3" fill="#64748B"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="closing-message-slot" data-pptx-placeholder="title"
    data-pptx-bounds="48 330 1184 96">
    <text id="closing-message-carrier" data-pptx-carrier="true"
      x="48" y="400" fill="#F8FAFC" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="44" font-weight="700">{{CLOSING_MESSAGE}}</text>
  </g>
  <g id="closing-contact-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="48 452 900 48">
    <text id="closing-contact-carrier" data-pptx-carrier="true"
      x="48" y="488" fill="#94A3B8" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="20">{{CONTACT_LINE}}</text>
  </g>
</svg>
