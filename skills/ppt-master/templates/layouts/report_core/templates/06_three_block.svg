    <text id="three-block-pagenum-carrier" data-pptx-carrier="true"
      x="1232" y="698" text-anchor="end" fill="#94A3B8"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="12">{{PAGE_NUM}}</text>
