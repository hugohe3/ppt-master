<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"
  data-pptx-master="moments_square_master" data-pptx-master-name="Moments Square"
  data-pptx-layout="statement" data-pptx-layout-name="Statement">
  <rect id="master-background" x="0" y="0" width="1080" height="1080" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="statement-accent" x="490" y="340" width="100" height="8" rx="4" fill="#CBD5E1"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="statement-message-slot" data-pptx-placeholder="title"
    data-pptx-bounds="100 400 880 300">
    <text id="statement-message-carrier" data-pptx-carrier="true"
      x="540" y="490" text-anchor="middle" fill="#1E293B"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="60" font-weight="700">{{KEY_MESSAGE}}</text>
  </g>
  <g id="statement-support-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="140 760 800 100">
    <text id="statement-support-carrier" data-pptx-carrier="true"
      x="540" y="810" text-anchor="middle" fill="#64748B"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="30">{{SUPPORT_TEXT}}</text>
  </g>
</svg>
