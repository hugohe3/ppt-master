<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"
  data-pptx-master="moments_square_master" data-pptx-master-name="Moments Square"
  data-pptx-layout="cover" data-pptx-layout-name="Cover">
  <rect id="master-background" x="0" y="0" width="1080" height="1080" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="cover-accent" x="490" y="300" width="100" height="8" rx="4" fill="#CBD5E1"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-brand-band" x="0" y="900" width="1080" height="180" fill="#F4F6F8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="cover-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="100 360 880 240">
    <text id="cover-title-carrier" data-pptx-carrier="true"
      x="540" y="456" text-anchor="middle" fill="#1E293B"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="68" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="140 640 800 100">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true"
      x="540" y="692" text-anchor="middle" fill="#64748B"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="30">{{SUBTITLE}}</text>
  </g>
  <g id="cover-brand-slot" data-pptx-placeholder="body" data-pptx-idx="2"
    data-pptx-bounds="100 960 880 60">
    <text id="cover-brand-carrier" data-pptx-carrier="true"
      x="540" y="1000" text-anchor="middle" fill="#475569"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="26">{{BRAND_LINE}}</text>
  </g>
</svg>
