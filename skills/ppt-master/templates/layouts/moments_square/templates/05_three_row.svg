<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"
  data-pptx-master="moments_square_master" data-pptx-master-name="Moments Square"
  data-pptx-layout="three_row" data-pptx-layout-name="Three Row">
  <rect id="master-background" x="0" y="0" width="1080" height="1080" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="three-row-one" x="100" y="380" width="880" height="148" rx="16" fill="#F4F6F8"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="three-row-two" x="100" y="556" width="880" height="148" rx="16" fill="#F4F6F8"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="three-row-three" x="100" y="732" width="880" height="148" rx="16" fill="#F4F6F8"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="three-row-marker-one" cx="168" cy="454" r="28" fill="#E2E8F0"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="three-row-marker-two" cx="168" cy="630" r="28" fill="#E2E8F0"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="three-row-marker-three" cx="168" cy="806" r="28" fill="#E2E8F0"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="three-row-digit-one" x="168" y="464" text-anchor="middle" fill="#64748B"
    font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700"
    data-pptx-layer="layout" data-pptx-editable="false">1</text>
  <text id="three-row-digit-two" x="168" y="640" text-anchor="middle" fill="#64748B"
    font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700"
    data-pptx-layer="layout" data-pptx-editable="false">2</text>
  <text id="three-row-digit-three" x="168" y="816" text-anchor="middle" fill="#64748B"
    font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700"
    data-pptx-layer="layout" data-pptx-editable="false">3</text>
  <g id="three-row-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="100 110 880 210">
    <text id="three-row-title-carrier" data-pptx-carrier="true"
      x="100" y="232" fill="#1E293B" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="60" font-weight="700">{{PAGE_TITLE}}</text>
  </g>
  <g id="three-row-one-slot" data-pptx-placeholder="object" data-pptx-idx="1"
    data-pptx-bounds="220 404 736 100">
    <text id="three-row-one-carrier" data-pptx-carrier="true"
      x="220" y="452" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="28">{{ITEM_1}}</text>
  </g>
  <g id="three-row-two-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="220 580 736 100">
    <text id="three-row-two-carrier" data-pptx-carrier="true"
      x="220" y="628" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="28">{{ITEM_2}}</text>
  </g>
  <g id="three-row-three-slot" data-pptx-placeholder="object" data-pptx-idx="3"
    data-pptx-bounds="220 756 736 100">
    <text id="three-row-three-carrier" data-pptx-carrier="true"
      x="220" y="804" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
