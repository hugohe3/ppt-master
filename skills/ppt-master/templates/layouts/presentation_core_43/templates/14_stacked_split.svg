  </g>
  <g id="stacked-split-top-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="80 160 864 224">
    <text id="stacked-split-top-carrier" data-pptx-carrier="true"
      x="80" y="200" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="20">{{TOP_CONTENT}}</text>
  </g>
  <g id="stacked-split-bottom-slot" data-pptx-placeholder="body" data-pptx-idx="2"
    data-pptx-bounds="80 464 864 224">
    <text id="stacked-split-bottom-carrier" data-pptx-carrier="true"
      x="80" y="504" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="20">{{BOTTOM_CONTENT}}</text>
  </g>
