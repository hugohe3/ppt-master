<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768"
  data-pptx-master="presentation_core_43_master" data-pptx-master-name="Presentation Core 4:3"
  data-pptx-layout="stacked_split" data-pptx-layout-name="Stacked Split">
  <rect id="master-background" x="0" y="0" width="1024" height="768" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="stacked-split-top-panel" x="56" y="136" width="912" height="272" rx="12" fill="#F4F6F8"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="stacked-split-bottom-panel" x="56" y="440" width="912" height="272" rx="12" fill="#EEF2F6"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="stacked-split-title-slot" data-pptx-placeholder="title"
