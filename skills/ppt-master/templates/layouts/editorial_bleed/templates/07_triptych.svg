      x="427" y="0" width="427" height="720" preserveAspectRatio="none"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="/>
  </g>
  <g id="triptych-picture-three-slot" data-pptx-placeholder="picture" data-pptx-idx="3"
