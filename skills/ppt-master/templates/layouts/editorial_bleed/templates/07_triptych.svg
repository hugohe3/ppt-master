<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="editorial_bleed_master" data-pptx-master-name="Editorial Bleed"
  data-pptx-layout="triptych" data-pptx-layout-name="Triptych">
  <defs>
    <linearGradient id="triptych-top-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="triptych-bottom-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.80"/>
    </linearGradient>
  </defs>
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#0F172A"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <g id="triptych-picture-one-slot" data-pptx-placeholder="picture" data-pptx-idx="1"
    data-pptx-bounds="0 0 427 720">
    <image id="triptych-picture-one-carrier" data-pptx-carrier="true"
      x="0" y="0" width="427" height="720" preserveAspectRatio="none"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="/>
  </g>
  <g id="triptych-picture-two-slot" data-pptx-placeholder="picture" data-pptx-idx="2"
