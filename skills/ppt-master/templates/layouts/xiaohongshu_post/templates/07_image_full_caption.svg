<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660"
  data-pptx-master="xiaohongshu_post_master" data-pptx-master-name="Xiaohongshu Post"
  data-pptx-layout="image_full_caption" data-pptx-layout-name="Full-Bleed Image with Caption">
  <rect id="master-background" x="0" y="0" width="1242" height="1660" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="image-full-caption-band" x="0" y="1400" width="1242" height="260" fill="#F4F6F8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="image-full-caption-picture-slot" data-pptx-placeholder="picture" data-pptx-idx="1"
    data-pptx-bounds="0 0 1242 1400">
    <image id="image-full-caption-picture-carrier" data-pptx-carrier="true"
      x="0" y="0" width="1242" height="1400" preserveAspectRatio="none"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="/>
  </g>
  <g id="image-full-caption-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="80 1440 1082 80">
    <text id="image-full-caption-title-carrier" data-pptx-carrier="true"
      x="80" y="1500" fill="#1E293B" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="48" font-weight="700">{{PAGE_TITLE}}</text>
  </g>
  <g id="image-full-caption-caption-slot" data-pptx-placeholder="body" data-pptx-idx="2"
    data-pptx-bounds="80 1540 1082 80">
    <text id="image-full-caption-caption-carrier" data-pptx-carrier="true"
      x="80" y="1592" fill="#64748B" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="30">{{CAPTION}}</text>
  </g>
</svg>
