<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660"
  data-pptx-master="xiaohongshu_post_master" data-pptx-master-name="Xiaohongshu Post"
  data-pptx-layout="title_content" data-pptx-layout-name="Title and Content">
  <rect id="master-background" x="0" y="0" width="1242" height="1660" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="title-content-rule" x1="80" y1="320" x2="1162" y2="320" stroke="#E2E8F0"
    stroke-width="3" data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="title-content-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="80 112 1082 200">
    <text id="title-content-title-carrier" data-pptx-carrier="true"
      x="80" y="232" fill="#1E293B" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="64" font-weight="700">{{PAGE_TITLE}}</text>
  </g>
  <g id="title-content-body-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="80 376 1082 1064">
    <text id="title-content-body-carrier" data-pptx-carrier="true"
      x="80" y="440" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="34">{{CONTENT_AREA}}</text>
  </g>
  <g id="title-content-footer-slot" data-pptx-placeholder="footer" data-pptx-idx="2"
    data-pptx-bounds="80 1500 1082 60">
    <text id="title-content-footer-carrier" data-pptx-carrier="true"
      x="80" y="1542" fill="#94A3B8" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="26">{{FOOTER_NOTE}}</text>
  </g>
</svg>
