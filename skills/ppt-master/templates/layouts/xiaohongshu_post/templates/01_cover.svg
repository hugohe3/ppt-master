<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660"
  data-pptx-master="xiaohongshu_post_master" data-pptx-master-name="Xiaohongshu Post"
  data-pptx-layout="cover" data-pptx-layout-name="Cover">
  <rect id="master-background" x="0" y="0" width="1242" height="1660" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="cover-accent" x="80" y="360" width="120" height="10" rx="5" fill="#CBD5E1"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-brand-band" x="0" y="1500" width="1242" height="160" fill="#F4F6F8"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="cover-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="80 420 1082 300">
    <text id="cover-title-carrier" data-pptx-carrier="true"
      x="80" y="520" fill="#1E293B" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="86" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="80 760 1002 120">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true"
      x="80" y="812" fill="#64748B" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="36">{{SUBTITLE}}</text>
  </g>
  <g id="cover-brand-slot" data-pptx-placeholder="body" data-pptx-idx="2"
    data-pptx-bounds="80 1550 1082 60">
    <text id="cover-brand-carrier" data-pptx-carrier="true"
      x="80" y="1592" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="30">{{BRAND_LINE}}</text>
  </g>
</svg>
