<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660"
  data-pptx-master="xiaohongshu_post_master" data-pptx-master-name="Xiaohongshu Post"
  data-pptx-layout="statement" data-pptx-layout-name="Statement">
  <rect id="master-background" x="0" y="0" width="1242" height="1660" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="statement-accent" x="571" y="560" width="100" height="8" rx="4" fill="#CBD5E1"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="statement-message-slot" data-pptx-placeholder="title"
    data-pptx-bounds="80 640 1082 380">
    <text id="statement-message-carrier" data-pptx-carrier="true"
      x="621" y="740" text-anchor="middle" fill="#1E293B"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="72" font-weight="700">{{KEY_MESSAGE}}</text>
  </g>
  <g id="statement-support-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="120 1080 1002 120">
    <text id="statement-support-carrier" data-pptx-carrier="true"
      x="621" y="1132" text-anchor="middle" fill="#64748B"
      font-family="Arial, Microsoft YaHei, sans-serif" font-size="34">{{SUPPORT_TEXT}}</text>
  </g>
</svg>
