<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"
  data-pptx-master="story_vertical_master" data-pptx-master-name="Story Vertical"
  data-pptx-layout="title_content" data-pptx-layout-name="Title and Content">
  <rect id="master-background" x="0" y="0" width="1080" height="1920" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <line id="title-content-rule" x1="80" y1="400" x2="1000" y2="400" stroke="#E2E8F0"
    stroke-width="3" data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="title-content-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="80 200 920 180">
    <text id="title-content-title-carrier" data-pptx-carrier="true"
      x="80" y="306" fill="#1E293B" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="56" font-weight="700">{{PAGE_TITLE}}</text>
  </g>
  <g id="title-content-body-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="80 440 920 1180">
    <text id="title-content-body-carrier" data-pptx-carrier="true"
      x="80" y="502" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="32">{{CONTENT_AREA}}</text>
  </g>
  <g id="title-content-footer-slot" data-pptx-placeholder="footer" data-pptx-idx="2"
    data-pptx-bounds="80 1660 920 56">
    <text id="title-content-footer-carrier" data-pptx-carrier="true"
      x="80" y="1700" fill="#94A3B8" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="24">{{FOOTER_NOTE}}</text>
  </g>
</svg>
