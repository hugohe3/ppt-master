    data-pptx-layer="layout" data-pptx-editable="false">1</text>
  <text id="numbered-list-digit-two" x="168" y="944" text-anchor="middle" fill="#64748B"
    font-family="Arial, Microsoft YaHei, sans-serif" font-size="36" font-weight="700"
    data-pptx-layer="layout" data-pptx-editable="false">2</text>
  <text id="numbered-list-digit-three" x="168" y="1354" text-anchor="middle" fill="#64748B"
    font-family="Arial, Microsoft YaHei, sans-serif" font-size="36" font-weight="700"
    data-pptx-layer="layout" data-pptx-editable="false">3</text>
  <g id="numbered-list-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="80 200 920 180">
    <text id="numbered-list-title-carrier" data-pptx-carrier="true"
      x="80" y="306" fill="#1E293B" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="56" font-weight="700">{{PAGE_TITLE}}</text>
  </g>
  <g id="numbered-list-one-slot" data-pptx-placeholder="object" data-pptx-idx="1"
    data-pptx-bounds="240 464 760 312">
    <text id="numbered-list-one-carrier" data-pptx-carrier="true"
      x="240" y="520" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="32">{{ITEM_1}}</text>
  </g>
  <g id="numbered-list-two-slot" data-pptx-placeholder="object" data-pptx-idx="2"
    data-pptx-bounds="240 874 760 312">
    <text id="numbered-list-two-carrier" data-pptx-carrier="true"
      x="240" y="930" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="32">{{ITEM_2}}</text>
  </g>
  <g id="numbered-list-three-slot" data-pptx-placeholder="object" data-pptx-idx="3"
    data-pptx-bounds="240 1284 760 312">
    <text id="numbered-list-three-carrier" data-pptx-carrier="true"
      x="240" y="1340" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="32">{{ITEM_3}}</text>
  </g>
  <g id="numbered-list-footer-slot" data-pptx-placeholder="footer" data-pptx-idx="4"
