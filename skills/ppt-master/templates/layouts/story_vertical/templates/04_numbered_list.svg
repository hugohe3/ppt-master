<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"
  data-pptx-master="story_vertical_master" data-pptx-master-name="Story Vertical"
  data-pptx-layout="numbered_list" data-pptx-layout-name="Numbered List">
  <rect id="master-background" x="0" y="0" width="1080" height="1920" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="numbered-list-row-one" x="80" y="440" width="920" height="360" rx="20" fill="#F4F6F8"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="numbered-list-row-two" x="80" y="850" width="920" height="360" rx="20" fill="#F4F6F8"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="numbered-list-row-three" x="80" y="1260" width="920" height="360" rx="20" fill="#F4F6F8"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="numbered-list-marker-one" cx="168" cy="520" r="40" fill="#E2E8F0"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="numbered-list-marker-two" cx="168" cy="930" r="40" fill="#E2E8F0"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="numbered-list-marker-three" cx="168" cy="1340" r="40" fill="#E2E8F0"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="numbered-list-digit-one" x="168" y="534" text-anchor="middle" fill="#64748B"
