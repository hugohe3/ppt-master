<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"
  data-pptx-master="story_vertical_master" data-pptx-master-name="Story Vertical"
  data-pptx-layout="image_top_text" data-pptx-layout-name="Image over Text">
  <rect id="master-background" x="0" y="0" width="1080" height="1920" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="image-top-text-image-panel" x="80" y="440" width="920" height="760" rx="24" fill="#EEF2F6"
    stroke="#D6DCE3" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="image-top-text-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="80 200 920 180">
    <text id="image-top-text-title-carrier" data-pptx-carrier="true"
      x="80" y="306" fill="#1E293B" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="56" font-weight="700">{{PAGE_TITLE}}</text>
  </g>
  <g id="image-top-text-picture-slot" data-pptx-placeholder="picture" data-pptx-idx="1"
    data-pptx-bounds="80 440 920 760">
    <image id="image-top-text-picture-carrier" data-pptx-carrier="true"
      x="80" y="440" width="920" height="760" preserveAspectRatio="none"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="/>
  </g>
  <g id="image-top-text-body-slot" data-pptx-placeholder="body" data-pptx-idx="2"
    data-pptx-bounds="80 1260 920 360">
    <text id="image-top-text-body-carrier" data-pptx-carrier="true"
      x="80" y="1322" fill="#475569" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="32">{{CONTENT_AREA}}</text>
  </g>
  <g id="image-top-text-footer-slot" data-pptx-placeholder="footer" data-pptx-idx="3"
    data-pptx-bounds="80 1660 920 56">
    <text id="image-top-text-footer-carrier" data-pptx-carrier="true"
      x="80" y="1700" fill="#94A3B8" font-family="Arial, Microsoft YaHei, sans-serif"
      font-size="24">{{FOOTER_NOTE}}</text>
  </g>
</svg>
